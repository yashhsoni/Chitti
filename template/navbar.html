<script>
  (function initMusicPlayer() {
    const musicSrc = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
    let audio = null;
    let isPlaying = false;

    const btn = document.getElementById('musicToggleBtn');
    const icon = document.getElementById('musicIcon');

    function getAudio() {
      if (!audio) {
        audio = new Audio(musicSrc);
        audio.loop = true;
        // Comfortable low volume for background ambient music
        audio.volume = 0.25;
      }
      return audio;
    }

    function togglePlay() {
      const a = getAudio();
      if (isPlaying) {
        a.pause();
        isPlaying = false;
        localStorage.setItem('music_state', 'muted');
        updateUI(false);
      } else {
        a.play().then(() => {
          isPlaying = true;
          localStorage.setItem('music_state', 'playing');
          updateUI(true);
        }).catch(err => {
          console.warn("Autoplay blocked by browser, waiting for user interaction.", err);
        });
      }
    }

    function updateUI(playing) {
      if (playing) {
        btn.classList.add('playing');
        icon.className = 'fa-solid fa-volume-high';
        btn.title = "Mute background music";
      } else {
        btn.classList.remove('playing');
        icon.className = 'fa-solid fa-volume-xmark';
        btn.title = "Unmute background music";
      }
    }

    if (btn) {
      btn.addEventListener('click', togglePlay);
    }

    // Restore state from localStorage
    const savedState = localStorage.getItem('music_state');
    if (savedState === 'playing') {
      const attemptPlay = () => {
        const a = getAudio();
        a.play().then(() => {
          isPlaying = true;
          updateUI(true);
        }).catch(() => {
          // If blocked, wait for first user interaction (click/keydown) on the document to play
          const resumeOnInteraction = () => {
            a.play().then(() => {
              isPlaying = true;
              updateUI(true);
            });
            document.removeEventListener('click', resumeOnInteraction);
            document.removeEventListener('keydown', resumeOnInteraction);
          };
          document.addEventListener('click', resumeOnInteraction);
          document.addEventListener('keydown', resumeOnInteraction);
        });
      };

      if (document.readyState === 'complete') {
        attemptPlay();
      } else {
        window.addEventListener('load', attemptPlay);
      }
    } else {
      updateUI(false);
    }
  })();
</script>
